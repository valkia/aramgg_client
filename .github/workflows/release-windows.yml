name: Build Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 45

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ARAMGG_DISTRIBUTION_CHANNEL: official
      ARAMGG_MATCH_HISTORY_UPLOAD_ORIGIN: https://aramgg.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm

      - name: Print tool versions
        run: |
          node --version
          npm --version

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          $expectedTag = "v$packageVersion"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            Write-Error "Release tag '$env:GITHUB_REF_NAME' does not match package.json version '$packageVersion'. Expected '$expectedTag'."
            exit 1
          }

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm run test:unit

      - name: Package Windows installer
        shell: pwsh
        run: |
          $env:ELECTRON_CACHE = Join-Path $env:RUNNER_TEMP 'electron-cache'
          $env:ELECTRON_BUILDER_CACHE = Join-Path $env:RUNNER_TEMP 'electron-builder-cache'
          npm run pack

      - name: Verify packaged locale datasets
        run: node scripts/verify-packaged-client-data.mjs build/win-unpacked/resources/client-data

      - name: Smoke test packaged Windows application
        timeout-minutes: 4
        run: npm run test:packaged-windows

      - name: Upload packaged smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aramgg-client-window-smoke
          if-no-files-found: warn
          path: build/release-smoke/

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: aramgg-client-windows
          if-no-files-found: error
          path: |
            build/*.exe
            build/*.exe.blockmap
            build/latest.yml

  build-mac:
    name: Build macOS Apple silicon application
    runs-on: macos-15
    timeout-minutes: 45

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm

      - name: Validate platform and release tag
        run: |
          node --version
          npm --version
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          assert.equal(process.platform, 'darwin')
          assert.equal(process.arch, 'arm64', 'Mac native capture must be built on Apple silicon')
          if (process.env.GITHUB_REF.startsWith('refs/tags/v')) {
            const { version } = JSON.parse(readFileSync('package.json', 'utf8'))
            assert.equal(process.env.GITHUB_REF_NAME, `v${version}`)
          }
          NODE

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm run test:unit

      - name: Package macOS application
        run: |
          export ELECTRON_CACHE="$RUNNER_TEMP/electron-cache"
          export ELECTRON_BUILDER_CACHE="$RUNNER_TEMP/electron-builder-cache"
          npm run pack:mac

      - name: Verify packaged locale datasets
        run: node scripts/verify-packaged-client-data.mjs build/mac-arm64/aramgg_client.app/Contents/Resources/client-data

      - name: Smoke test packaged macOS application and OCR
        timeout-minutes: 4
        run: npm run test:packaged-mac

      - name: Upload packaged smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aramgg-client-mac-smoke
          if-no-files-found: warn
          path: build/mac-smoke/

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: aramgg-client-macos-arm64
          if-no-files-found: error
          path: build/ARAMGG-Mac-*-arm64.zip

  publish:
    name: Publish GitHub preview release
    needs: [build, build-mac]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: aramgg-client-windows
          path: release-assets

      - name: Download macOS application
        uses: actions/download-artifact@v4
        with:
          name: aramgg-client-macos-arm64
          path: release-assets

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          assets=(release-assets/*.exe release-assets/*.exe.blockmap release-assets/latest.yml release-assets/ARAMGG-Mac-*-arm64.zip)
          if [ "${#assets[@]}" -ne 4 ] || [ ! -f release-assets/latest.yml ]; then
            echo 'Expected Windows installer, blockmap, latest.yml and macOS ZIP'
            exit 1
          fi

          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          GitHub-only preview for testing Windows and macOS packages. The stable Latest release and production client version configuration are not changed.

          - Windows x64: `aramgg_client Setup *.exe` (with blockmap and update metadata).
          - Apple silicon, macOS 14+: `ARAMGG-Mac-*-arm64.zip`. Extract the ZIP to get `aramgg_client.app`.
          - macOS builds are ad-hoc signed and not notarized. Screen Recording permission and borderless/windowed League are required for game capture; the optional Tab guide needs Input Monitoring.
          - Both platforms passed packaged window smoke checks; the macOS smoke check also runs OCR against a committed fixture. Live game acceptance is separate.

          macOS setup and known limits: https://github.com/valkia/aramgg_client/blob/master/docs/MACOS.md
          NOTES
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag --title "$GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease --latest=false
          fi
